</style></head><body><div id="app"></div><script id="dataset" type="application/json">{"cities": [{"id": "moscow", "name": "Москва", "number": "01", "lat": 55.7558, "lon": 37.6173, "year": "1941", "title": "ЗИС и спасение автомобильного производства", "machine": "ЗИС-5", "photo": {"src": "zis5.jpg", "cap": "Грузовой ЗИС-5 и военнослужащие. Советская фронтовая фотография периода Великой Отечественной войны", "credit": "Иллюстрация к материалу «История.РФ»"}, "other": {"src": "zis-column.jpg", "cap": "Колонна ЗИС-5 с военнослужащими. Архивный снимок военных лет", "credit": "Архивная фотография, публикация журнала «За рулём»"}, "factory": {"name": "Московский автомобильный завод имени Сталина (ЗИС), позднее ЗИЛ", "address": "Москва, Автозаводская улица, 23 — бывшая промышленная территория", "today": "Крупное производство на исторической территории прекращено; бывшую промзону реконструируют. Это не действующий сейчас завод ЗИС.", "founded": "1916 — строительство предшественника АМО; 1931 — переименование в ЗИС"}, "person": {"name": "Иван Алексеевич Лихачёв", "role": "Директор ЗИС в предвоенные годы и в период эвакуации", "text": "Под его руководством завод развивал крупносерийное автомобилестроение; в годы войны руководству и рабочим пришлось обеспечивать одновременно оборонные заказы и эвакуацию оборудования."}, "facts": [["1933", "начало серийного выпуска ЗИС-5"], ["3 т", "номинальная грузоподъёмность"], ["73 л. с.", "мощность базового двигателя"], ["16.10.1941", "решение об эвакуации завода"]], "sections": [["Машина, которая была нужна стране", "Серийный выпуск ЗИС-5 начался в 1933 году. Это был двухосный грузовой автомобиль грузоподъёмностью 3 тонны, который стал одним из массовых грузовиков довоенного СССР. Он использовался в промышленности, сельском хозяйстве и транспортных подразделениях армии. Народное прозвище «трёхтонка» связано именно с паспортной грузоподъёмностью. Автомобиль был важен не только количеством выпущенных машин: для него существовала сеть ремонтных мастерских, водителей, механиков и поставщиков запасных частей. Война показала значение этой уже освоенной техники."], ["Как был устроен ЗИС-5", "ЗИС-5 получил рядный шестицилиндровый карбюраторный бензиновый двигатель рабочим объёмом около 5,55 литра и мощностью 73 л. с. в базовом исполнении. Колёсная формула — 4×2: ведущими были задние колёса. Сцепление соединяло двигатель с четырёхступенчатой механической коробкой передач, затем вращение передавалось карданным валом к заднему мосту. Машина имела прочную раму и сравнительно доступную для ремонтных мастерских конструкцию. В обычном техническом обслуживании следили за уровнем масла, охлаждением двигателя, системой зажигания, состоянием трансмиссии и тормозов."], ["Автомобиль на войне", "К 1941 году автомобили семейства ЗИС-5 составляли существенную часть грузового парка Красной армии. Грузовики возили продовольствие и боеприпасы, перевозили военнослужащих и буксировали оборудование. Их применяли и как шасси для специальных надстроек. Грузовой транспорт не заменял железную дорогу: на дальние расстояния большие объёмы грузов шли железнодорожным сообщением, а автомобиль был необходим на последнем участке маршрута и при перемещениях подразделений. Для фронта были важны регулярный ремонт, наличие шин, топлива и запчастей."], ["Эвакуация: почему не хватало просто перевезти станки", "Осенью 1941 года возникла угроза Москве. 16 октября было принято решение об эвакуации автомобильного завода ЗИС. Вместе с оборудованием следовало перевозить инструмент, чертежи, квалифицированных рабочих и специалистов. Отдельные группы цехов распределялись между разными восточными площадками. Сначала производственные мощности направляли в Ульяновск, а позднее по решениям ГКО часть моторных и литейных производств организовывали в Миассе. Новым заводам требовались электроснабжение, помещения, сборочные участки, поставки металла и комплектующих."], ["ЗИС — Ульяновск — Миасс", "30 ноября 1941 года ГКО принял решение организовать автомоторное и литейное производство в Миассе. Первый цех нового предприятия заработал в марте 1942 года. 14 февраля 1943 года последовало решение о переводе из Ульяновска в Миасс выпуска готовых грузовиков. В результате формирование предприятия продолжалось несколько лет. Первый грузовик ЗИС-5В с миасского конвейера вышел 8 июля 1944 года. Поэтому неверно считать, что завод начал массовый выпуск автомобилей сразу после прибытия первых станков."], ["Завод и город сегодня", "ЗИС находился на территории нынешней Автозаводской улицы в Москве. Впоследствии предприятие носило имя Ивана Лихачёва и получило обозначение ЗИЛ. Массовое автомобилестроение на старой промышленной площадке прекращено; территория в XXI веке подверглась масштабной реконструкции. Но история завода не исчезла: в 1941 году часть его инженерной и производственной системы стала основой автомобильных предприятий в других городах."]], "specs": [["3 000 кг", "грузоподъёмность"], ["4×2", "колёсная формула"], ["6 цилиндров", "бензиновый двигатель"], ["4 передачи", "механическая КПП"]], "route": ["moscow", "ulyanovsk", "miass"], "quiz": [{"type": "choice", "question": "Какой вариант правильно соотносит изменения специализации предприятий бывшего ЗИС с решениями 1941–1943 гг.?", "options": ["16 октября 1941 — решение об эвакуации ЗИС; 30 ноября 1941 — размещение автомоторного и литейного производства в Миассе; 14 февраля 1943 — перевод туда выпуска грузовиков", "16 октября 1941 — завершение сборки ЗИС-5В в Миассе; 30 ноября 1941 — решение об эвакуации; 14 февраля 1943 — начало работ в московских цехах", "30 ноября 1941 — эвакуация Харьковского завода № 183 в Миасс; март 1942 — запуск производства ЗИС-5В; февраль 1943 — расширение московского завода", "16 октября 1941 — производство Т-34 в Миассе; февраль 1943 — эвакуация ЗИС; июль 1944 — решение о строительстве нового автомоторного цеха"], "correct": 0, "explanation": "История ЗИС включала несколько решений: эвакуацию, формирование моторного производства и последующий перевод сборки грузовиков."}, {"type": "match", "question": "Свяжите техническую характеристику ЗИС-5 с её значением для эксплуатации и производства.", "options": [["Колёсная формула 4×2", "Четырёхступенчатая КПП", "Номинальная грузоподъёмность 3 т"], ["Передаточные отношения для движения под нагрузкой", "Возможность перевозить до трёх тонн груза по паспортным данным", "Ведущая задняя ось"]], "correct": [2, 0, 1], "explanation": "Колёсная формула, коробка передач и грузоподъёмность описывают разные свойства грузовика."}, {"type": "choice", "question": "В каком порядке происходили решения, связанные с эвакуацией ЗИС и Миассом?", "options": ["Октябрь 1941 — ноябрь 1941 — февраль 1943", "Октябрь 1941 — февраль 1943 — ноябрь 1943", "Ноябрь 1941 — октябрь 1942 — февраль 1943", "Февраль 1943 — ноябрь 1941 — октябрь 1941"], "correct": 0, "explanation": "16 октября 1941 — эвакуация ЗИС; 30 ноября 1941 — моторные цеха в Миассе; 14 февраля 1943 — решение о грузовиках."}, {"type": "multi", "question": "Какие узлы и подразделения были нужны, чтобы после эвакуации выпускать готовые грузовики?", "options": ["Моторные и механические цеха", "Производство КПП и ведущих мостов", "Сборка и испытания машин", "Только склад готовых кабин"], "correct": [0, 1, 2], "explanation": "Выпуск автомобиля требует согласованного изготовления многих агрегатов и окончательной сборки."}, {"type": "order", "question": "Расположите события ЗИС — Миасс по времени.", "options": ["Первый грузовик ЗИС-5В в Миассе", "Решение о моторном производстве в Миассе", "Решение об эвакуации ЗИС", "Перевод выпуска готовых грузовиков из Ульяновска"], "correct": [2, 1, 3, 0], "explanation": "1941, октябрь → 1941, ноябрь → 1943, февраль → 1944, июль."}, {"type": "match", "question": "Соотнесите автомобильный агрегат с его функцией.", "options": [["Двигатель", "Коробка передач", "Ведущий мост"], ["Изменяет передаточное отношение", "Передаёт тягу к ведущим колёсам", "Создаёт крутящий момент"]], "correct": [2, 0, 1], "explanation": "Двигатель → КПП → ведущий мост."}, {"type": "choice", "question": "Для чего на ЗИС-5 использовали четырёхступенчатую КПП?", "options": ["Для изменения тяги и скорости в разных дорожных условиях", "Для охлаждения двигателя на стоянке", "Для преобразования бензина в газ", "Для работы лебёдки на каждой машине"], "correct": 0, "explanation": "КПП изменяет соотношение скорости и крутящего момента."}, {"type": "choice", "question": "Какое свидетельство лучше всего подтвердит число эвакуированных станков конкретного цеха?", "options": ["Ведомость отправки оборудования", "Фронтовая фотография ЗИС-5", "Рекламный плакат грузовика", "Карта размещения городов"], "correct": 0, "explanation": "Количественные данные проверяют по документам, а не по внешнему виду техники."}, {"type": "choice", "question": "Если мотор исправен, но машина не трогается, какую группу узлов проверяют в том числе?", "options": ["Сцепление, КПП и карданную передачу", "Радиатор и термостат, исключив КПП", "Только рулевую трапецию", "Только фары и электропроводку"], "correct": 0, "explanation": "Отсутствие передачи крутящего момента может указывать на неисправность трансмиссии."}]}, {"id": "tagil", "name": "Нижний Тагил", "number": "02", "lat": 57.91, "lon": 59.99, "year": "1941–1945", "title": "Т-34: завод, двигатель и массовая сборка", "machine": "Т-34", "photo": {"src": "photo-3.jpg", "cap": "Сборка танков Т-34 на одном из уральских заводов, 1942 год", "credit": "Советская фотохроника / Государственный исторический музей"}, "other": {"src": "photo-3.jpg", "cap": "Сборка танков Т-34 на одном из уральских заводов, 1942 год", "credit": "Советская фотохроника / Государственный исторический музей"}, "factory": {"name": "Уралвагонзавод — Уральский танковый завод № 183 в годы войны", "address": "Нижний Тагил, Восточное шоссе, 28", "today": "Промышленная площадка Уралвагонзавода продолжает существовать; предприятие выпускает машиностроительную продукцию.", "founded": "1936 — начало работы Уралвагонзавода"}, "person": {"name": "Юрий Евгеньевич Максарев", "role": "Директор завода № 183 в годы эвакуации и развёртывания производства", "text": "Организация вывоза оборудования из Харькова и пуска производства в Нижнем Тагиле требовала согласования работы заводских коллективов и государственных органов."}, "facts": [["13.09.1941", "приказ об эвакуации завода № 183"], ["12", "цилиндров двигателя В-2-34"], ["500 л. с.", "мощность В-2-34"], ["1944", "освоение Т-34-85"]], "sections": [["Почему танковый завод оказался в Нижнем Тагиле", "Завод № 183 до войны работал в Харькове. 13 сентября 1941 года Наркомат танковой промышленности приказал эвакуировать его мощности и кадры на площадку Уралвагонзавода в Нижнем Тагиле. Первую очередь оборудования вывозили с расчётом на пуск в новом месте до отправки оставшихся станков. Это позволило уменьшить перерыв в обеспечении армии танками. Прибывшим рабочим и инженерам предстояло организовать бронекорпусное, механическое и сборочное производство практически в ходе продолжающейся войны."], ["Средний танк Т-34", "Т-34 сочетал дизельный двигатель, наклонное расположение части броневых листов и гусеничную ходовую. Важен не один отдельный параметр, а их взаимодействие: броня защищала экипаж, двигатель сообщал машине движение, трансмиссия передавала усилие к гусеницам, а вооружение позволяло поражать цели. В войсках танку требовались топливо, боеприпасы, обслуживание и ремонт. Механик-водитель управлял двигателем, коробкой передач и механизмами поворота в условиях большой нагрузки."], ["Дизель В-2-34", "Основным мотором Т-34 стал V-образный двенадцатицилиндровый дизель В-2-34 жидкостного охлаждения. Его максимальная мощность — 500 л. с. В дизеле топливо воспламеняется за счёт температуры воздуха после сжатия, а не электрической искры, как в карбюраторном ЗИС-5. Мотор требовал качественного обслуживания, внимания к смазке и охлаждению. В период дефицита дизелей отдельные Т-34 оснащались бензиновыми двигателями М-17, что напоминает о производственных трудностях военного времени."], ["Ходовая и трансмиссия", "Ранние Т-34 получили четырёхступенчатую механическую коробку передач; поздние модификации имели другую организацию переключения. Гусеницы распределяли нагрузку по поверхности грунта. Привод на ведущие колёса и поворотные механизмы позволяли танку менять направление. При тяжёлых маршах механики следили за состоянием траков, катков, гусениц, сцепления и КПП: неисправность одного узла могла обездвижить исправную по двигателю машину."], ["Как увеличивали выпуск", "После эвакуации сначала нужно было наладить кооперацию между цехами, а затем повышать темп производства. В 1942 году развивались поточные линии, применялась автоматическая сварка бронекорпусов под флюсом, связанная с трудами Е. О. Патона. В заводских исторических материалах приводится рост выпуска от 440 машин в первом квартале 1942 года до 2090 — в четвёртом. Это подтверждает значение организации производства не меньшее, чем отдельных конструктивных особенностей танка."], ["Танк и завод после войны", "В 1944 году на заводе № 183 наладили выпуск Т-34-85. Предприятие Нижнего Тагила продолжило работу и после Великой Отечественной войны. В современном городе сохранился Уралвагонзавод и музейная инфраструктура, связанная с историей бронетанковой техники. Изучая завод, можно проследить путь от довоенного вагоностроения к оборонному производству, а затем — к послевоенному машиностроению."]], "specs": [["В-2-34", "дизельный двигатель"], ["500 л. с.", "мощность двигателя"], ["гусеницы", "ходовая часть"], ["№ 183", "завод в Нижнем Тагиле"]], "route": ["kharkov", "tagil"], "quiz": [{"type": "choice", "question": "Какой набор отличает штатный Т-34 1942 года от ЗИС-5 и Т-70 по силовой установке?", "options": ["Рядный карбюраторный двигатель, 6 цилиндров, 73 л. с.", "V-образный дизель В-2-34, 12 цилиндров, 500 л. с.", "Спаренная бензиновая установка ГАЗ-203, 12 цилиндров суммарно, 140 л. с.", "Дизель В-2К тяжёлого танка КВ"], "correct": 1, "explanation": "Основным двигателем Т-34 был В-2-34 (временные исключения при дефиците моторов отдельно оговорены)."}, {"type": "choice", "question": "Какой завод прибыл из Харькова на площадку Уралвагонзавода?", "options": ["№ 183", "№ 75", "ЗИС", "ГАЗ"], "correct": 0, "explanation": "Из Харькова эвакуировали танковый завод № 183."}, {"type": "multi", "question": "Какие задачи решали при развёртывании производства Т-34?", "options": ["Монтаж станков и оснастки", "Организация выпуска корпусов и деталей", "Согласование поставок и сборки", "Отказ от контроля качества всех сварных швов"], "correct": [0, 1, 2], "explanation": "Требовались и технология, и логистика, и качество."}, {"type": "order", "question": "Расположите события по времени.", "options": ["Рост поточного производства в 1942 году", "Приказ об эвакуации завода № 183", "Освоение Т-34-85", "Первые Т-34 в Нижнем Тагиле"], "correct": [1, 3, 0, 2], "explanation": "Сентябрь 1941 → декабрь 1941 → 1942 → март 1944."}, {"type": "match", "question": "Соотнесите термин с характеристикой.", "options": [["В-2-34", "Механическая КПП", "Гусеничная ходовая"], ["Изменяет передаточное отношение", "Дизель, 12 цилиндров", "Распределяет массу и обеспечивает движение по грунту"]], "correct": [1, 0, 2], "explanation": "Узлы выполняют различные функции."}, {"type": "choice", "question": "Почему по архивной фотографии цеха нельзя точно узнать выпуск танков за месяц?", "options": ["Не виден процесс сварки", "Не приведены заводские производственные отчёты", "На фотографии нет подписи к танку", "Выпуск нельзя измерять количеством машин"], "correct": 1, "explanation": "Для оценки производства нужна статистика."}, {"type": "choice", "question": "Каков максимальный показатель мощности В-2-34?", "options": ["140 л. с.", "73 л. с.", "500 л. с.", "600 л. с."], "correct": 2, "explanation": "Мощность дизеля В-2-34 — 500 л. с."}, {"type": "choice", "question": "Какое обстоятельство позволяло сокращать перерыв при эвакуации завода № 183?", "options": ["Поэтапная отправка и пуск оборудования", "Транспортировка только готовых танков", "Отказ от перевода рабочих", "Замена всех операций одной сборочной линией"], "correct": 0, "explanation": "Первую очередь станков требовалось установить до вывоза второй."}, {"type": "choice", "question": "Что следует проверить, если дизель работает, а к гусеницам не передаётся тяга?", "options": ["Трансмиссию и механизмы привода", "Броневые листы башни", "Только электрическую цепь зажигания свечей", "Боекомплект танка"], "correct": 0, "explanation": "Неполадки сцепления или КПП способны обездвижить исправный по мотору танк."}]}, {"id": "chelyabinsk", "name": "Челябинск", "number": "03", "lat": 55.1644, "lon": 61.4368, "year": "1941–1945", "title": "Танкоград и механика тяжёлых танков", "machine": "КВ / ИС-2", "photo": {"src": "photo-2.jpg", "cap": "Тяжёлые танки ИС-2 в Берлине, 1945 год", "credit": "Советская архивная фотография"}, "other": {"src": "photo-4.jpg", "cap": "Супруги Бойко — члены экипажа тяжёлого танка ИС-2, 1944 год", "credit": "Советская газета «Североморский лётчик»"}, "factory": {"name": "Челябинский тракторный завод / Челябинский Кировский завод военного времени", "address": "Челябинск, проспект Ленина, 3", "today": "ЧТЗ существует как промышленное предприятие, связанное с машиностроением и двигателестроением.", "founded": "1933 — пуск Челябинского тракторного завода"}, "person": {"name": "Жозеф Яковлевич Котин", "role": "Главный конструктор тяжёлых танков КВ и ИС", "text": "Работы конструкторских коллективов по тяжёлым танкам велись в тесной связи с испытаниями и возможностями серийного производства."}, "facts": [["1933", "запуск ЧТЗ"], ["1941", "эвакуация Кировского завода и завода № 75"], ["В-2К", "танковый дизель серии КВ"], ["1943", "работы по машинам ИС"]], "sections": [["Из тракторного центра — в Танкоград", "Челябинский тракторный завод существовал до войны, поэтому город располагал рабочими, инженерными кадрами и промышленной площадкой. Осенью 1941 года сюда прибыли мощности Ленинградского Кировского завода и Харьковского моторного завода № 75. Объединение производств стало основой крупного центра тяжёлого танкостроения. Его назвали «Танкоградом». История города показывает, что эвакуация требовала не просто здания для станков, а уже сложившейся инфраструктуры."], ["Тяжёлые танки КВ и ИС", "Танк КВ был одной из главных тяжёлых машин начального периода войны. В дальнейшем на заводах Танкограда осваивали семейство ИС. С увеличением массы бронетехники росли требования к силовой установке, коробке передач, механизмам поворота и ходовой части. Тяжёлые танки выполняли другие задачи, чем массовый средний Т-34, поэтому напрямую сравнивать модели только по мощности двигателя некорректно."], ["Почему двигатели производили отдельно", "Эвакуированный завод № 75 был связан с выпуском дизелей семейства В-2. Тяжёлые танки КВ использовали, в частности, вариант В-2К. Производство дизеля состояло из множества операций: литья деталей, обработки цилиндров, коленчатого вала, сборки, испытаний. Если готового двигателя нет, даже собранные корпус, башня и ходовая не превращаются в боеспособную машину. Поэтому история моторостроения — часть истории Танкограда."], ["Трансмиссия и ходовая тяжёлой машины", "Большая масса танка повышала требования к фрикционам, коробке передач, механизмам поворота и подвеске. Гусеницы помогали распределять нагрузку на грунт, но детали катков, траков и приводных механизмов изнашивались. На тяжёлых КВ и ИС применялись разные технические решения. Механики не могли считать их трансмиссии идентичными: освоение новой модели требовало новой документации и обучения."], ["Люди и конструкторские решения", "С историей тяжёлых танков связан конструктор Жозеф Котин. Но даже удачный проект требовал большой совместной работы конструкторских бюро, производственников, металлургов и испытателей. Переход от чертежа к серийному выпуску проходил через устранение дефектов, создание оснастки, обучение рабочих и наладку поставок. В войну это делалось в сжатые сроки."], ["Где находится Танкоград сегодня", "Исторической основой Танкограда стал Челябинский тракторный завод. Его промышленная площадка находится в районе проспекта Ленина, 3. Заводская история продолжается и в наши дни, хотя номенклатура и организация производства менялись. Исторические фотографии фронтовых ИС-2 позволяют видеть применение техники, но исследовать заводские условия нужно по отдельным документам."]], "specs": [["КВ", "тяжёлый танк"], ["ИС-2", "тяжёлый танк"], ["В-2К", "семейство дизелей"], ["ЧТЗ", "промышленная основа"]], "route": ["leningrad", "chelyabinsk"], "quiz": [{"type": "choice", "question": "Какая тройка промышленных предприятий точнее всего отражает формирование Танкограда в 1941 году?", "options": ["ЧТЗ, завод № 183, Московский ЗИС", "ЧТЗ, Ленинградский Кировский завод, Харьковский завод № 75", "ЧТЗ, Уралвагонзавод, Горьковский автозавод", "Уралвагонзавод, завод № 183, Кировский завод"], "correct": 1, "explanation": "Основой были довоенный ЧТЗ, эвакуированный Кировский завод и Харьковский моторный завод № 75."}, {"type": "choice", "question": "Какие предприятия с ним объединились?", "options": ["Кировский завод и завод № 75", "ГАЗ и Уралвагонзавод", "ЗИС и Ульяновский автозавод", "Завод № 183 и Миасский"], "correct": 0, "explanation": "Ленинградский Кировский и харьковский моторный № 75."}, {"type": "multi", "question": "Какие подразделения нужны для выпуска тяжёлого танка?", "options": ["Моторостроение", "Корпусные и сборочные цеха", "Испытания агрегатов", "Только отдел окончательной окраски"], "correct": [0, 1, 2], "explanation": "Многие производственные операции связаны друг с другом."}, {"type": "order", "question": "Поставьте события в порядке.", "options": ["Освоение ИС", "Запуск ЧТЗ", "Эвакуация Кировского завода", "Формирование Танкограда"], "correct": [1, 2, 3, 0], "explanation": "Довоенный ЧТЗ → эвакуация 1941 → Танкоград → развитие ИС."}, {"type": "match", "question": "Сопоставьте завод и его роль.", "options": [["ЧТЗ", "Кировский завод", "Завод № 75"], ["Тяжёлое танкостроение", "Танковые дизели", "Довоенная челябинская площадка"]], "correct": [2, 0, 1], "explanation": "Три предприятия дополняли друг друга."}, {"type": "choice", "question": "Почему рост массы танка особенно сказывается на трансмиссии?", "options": ["Нагрузка на силовую передачу увеличивается", "Масса сама заменяет главную передачу", "КПП перестаёт быть нужна", "Мощность двигателя всегда остаётся той же"], "correct": 0, "explanation": "Передача усилия к гусеницам должна выдерживать нагрузки."}, {"type": "choice", "question": "Какой конструктор связан с тяжёлыми танками КВ и ИС?", "options": ["Андрей Липгарт", "Жозеф Котин", "Иван Лихачёв", "Евгений Патон"], "correct": 1, "explanation": "Ж. Я. Котин — один из ведущих конструкторов тяжёлых танков."}, {"type": "choice", "question": "Что подтверждает фронтовой снимок ИС-2?", "options": ["Его применение в войсках", "Точное число рабочих ЧКЗ", "Общий месячный выпуск дизелей", "Число цехов завода"], "correct": 0, "explanation": "Разные источники подтверждают разные исторические сведения."}, {"type": "choice", "question": "Почему завод № 75 был важен для Танкограда?", "options": ["Освоение двигателей семейства В-2", "Выпуск исключительно ЗИС-5В", "Сборка легковых ГАЗ-М1", "Ремонт гражданских тракторов без танковых агрегатов"], "correct": 0, "explanation": "Изготовление дизелей было одним из ключевых производственных направлений."}]}, {"id": "gorky", "name": "Горький", "number": "04", "lat": 56.3269, "lon": 44.0065, "year": "1941–1943", "title": "ГАЗ: от грузовика до бронеавтомобиля", "machine": "БА-64 / Т-70", "photo": {"src": "photo-0.jpg", "cap": "Колонна бронеавтомобилей БА-64 на марше к фронту, июль 1943 года", "credit": "Израиль Озерский / советская фотохроника"}, "other": {"src": "photo-0.jpg", "cap": "Колонна бронеавтомобилей БА-64 на марше к фронту, июль 1943 года", "credit": "Израиль Озерский / советская фотохроника"}, "factory": {"name": "Горьковский автомобильный завод (ГАЗ)", "address": "Нижний Новгород, проспект Ленина, 88", "today": "Промышленная площадка ГАЗ продолжает существовать и используется в автомобилестроении.", "founded": "1932 — начало работы Горьковского автомобильного завода"}, "person": {"name": "Андрей Александрович Липгарт", "role": "Главный конструктор ГАЗа в годы войны", "text": "Под его руководством конструкторские коллективы занимались легковыми и грузовыми машинами, бронеавтомобилями и работами по освоению новых видов техники."}, "facts": [["1932", "начало работы ГАЗа"], ["4×4", "колёсная формула БА-64"], ["ГАЗ-203", "силовая установка Т-70"], ["28.10.1943", "рапорт о восстановлении завода"]], "sections": [["Завод, который освоил несколько видов техники", "Горьковский автомобильный завод открылся в 1932 году. До войны предприятие выпускало массовые автомобили, в том числе грузовые семейства ГАЗ-АА. После начала войны завод перестраивал работу под оборонные заказы. Здесь осваивали бронеавтомобили БА-64, лёгкие танки Т-70, самоходные установки СУ-76 и другие виды продукции. Автомобильный опыт оказался полезен, но каждая новая машина требовала изменений в технологии и организации производства."], ["ГАЗ-АА: другая «полуторка»", "Грузовик ГАЗ-АА имел номинальную грузоподъёмность 1,5 тонны — в отличие от трёхтонного ЗИС-5. Эта разница была важна для перевозки грузов, планирования маршрутов и обслуживания. Грузовики были связаны со снабжением армии, но нельзя считать их одинаковыми по устройству. У ГАЗ-АА был четырёхцилиндровый бензиновый двигатель, тогда как ЗИС-5 использовал рядную «шестёрку». Такое сравнение показывает, как автомобилестроение разных заводов дополняло друг друга."], ["БА-64: полноприводный бронеавтомобиль", "БА-64 был создан на основе автомобильных агрегатов, связанных с полноприводной машиной ГАЗ-64. Колёсная формула 4×4 означала передачу крутящего момента на все четыре колеса. На грунтовых дорогах это помогало преодолевать сложные участки, но по распределению давления на почву колёсный бронеавтомобиль и гусеничный танк имели разные возможности. Важно различать бронеавтомобиль для разведки и связи и танк, применявшийся в бою иначе."], ["Т-70: два мотора вместо одного", "Лёгкий танк Т-70 использовал силовую установку ГАЗ-203, состоявшую из двух бензиновых шестицилиндровых двигателей ГАЗ-202, объединённых в один агрегат. Их суммарная максимальная мощность составляла около 140 л. с. Использование освоенных автомобильных двигателей позволяло опираться на существующее производство. Но механизм передачи мощности на гусеницы уже относился к танковой трансмиссии, а не к обычному приводу грузовика."], ["Июнь 1943: разрушения и восстановление", "С 4 по 22 июня 1943 года Горьковский автозавод подвергся семи массированным воздушным налётам. По материалам музея предприятия, были разрушены десятки зданий и выведены из строя тысячи единиц оборудования. Это означало остановку или нарушение работы ряда цехов, на которых зависели разные виды техники. Восстановление требовало не только ремонта зданий, но и наладки станков, электричества, потока деталей и кооперации между участками."], ["Завод тогда и сейчас", "28 октября 1943 года ГАЗ направил рапорт о полном восстановлении предприятия. Исторически завод располагался в Горьком — нынешнем Нижнем Новгороде — в Автозаводском районе. Современная промышленная площадка находится в районе проспекта Ленина, 88. Изучение ГАЗа показывает, что работа автомехаников, технологов и ремонтников была необходимой частью общей оборонной задачи."]], "specs": [["1,5 т", "грузоподъёмность ГАЗ-АА"], ["4×4", "привод БА-64"], ["ГАЗ-203", "силовая установка Т-70"], ["1943", "восстановление завода"]], "route": [], "quiz": [{"type": "choice", "question": "Какое сопоставление грузоподъёмности автомобилей массового выпуска соответствует довоенным техническим данным?", "options": ["ГАЗ-АА — 3 т; ЗИС-5 — 1,5 т", "ГАЗ-АА — 1,5 т; ЗИС-5 — 3 т", "ГАЗ-АА — 2 т; ЗИС-5 — 3 т", "ГАЗ-АА — 1,5 т; ЗИС-5 — 2 т"], "correct": 1, "explanation": "ГАЗ-АА называли «полуторкой», а ЗИС-5 — «трёхтонкой»."}, {"type": "choice", "question": "Чем отличались БА-64 и Т-70?", "options": ["Оба колёсные 4×4", "БА-64 — колёсный 4×4, Т-70 — гусеничный", "БА-64 — гусеничный, Т-70 — колёсный", "Оба только заднеприводные 4×2"], "correct": 1, "explanation": "У них разные ходовые части."}, {"type": "multi", "question": "Какие машины выпускал ГАЗ в годы войны?", "options": ["БА-64", "Т-70", "СУ-76", "ИС-2"], "correct": [0, 1, 2], "explanation": "ИС-2 связан с тяжёлым танкостроением."}, {"type": "order", "question": "Восстановите последовательность.", "options": ["Рапорт о восстановлении ГАЗа", "Освоение Т-70", "Начало выпуска СУ-76", "Июньские бомбардировки"], "correct": [1, 2, 3, 0], "explanation": "1942 → январь 1943 → июнь 1943 → октябрь 1943."}, {"type": "match", "question": "Соотнесите машину и силовую установку.", "options": [["ГАЗ-АА", "БА-64", "Т-70"], ["Два двигателя ГАЗ-202 (ГАЗ-203)", "Четырёхцилиндровый бензиновый мотор грузовика", "Полноприводный бронеавтомобиль на автомобильных агрегатах"]], "correct": [1, 2, 0], "explanation": "Техника имела разные назначение и устройство."}, {"type": "choice", "question": "Сколько двигателей объединяла силовая установка ГАЗ-203?", "options": ["Один", "Два", "Три", "Четыре"], "correct": 1, "explanation": "ГАЗ-203 — два мотора ГАЗ-202."}, {"type": "choice", "question": "Когда ГАЗ направил рапорт о полном восстановлении после налётов?", "options": ["28 октября 1943", "4 июня 1943", "8 июля 1944", "13 сентября 1941"], "correct": 0, "explanation": "Рапорт датируется 28 октября 1943 года."}, {"type": "choice", "question": "Каков технический смысл полного привода БА-64?", "options": ["Тяга на все четыре колеса", "Сцепление двух моторов на одном валу", "Четыре ступени коробки", "Переход на гусеничное шасси"], "correct": 0, "explanation": "Колёсная формула 4×4 означает все колёса ведущие."}, {"type": "choice", "question": "Почему разрушение цеха по выпуску деталей способно остановить несколько видов техники?", "options": ["Из-за межцеховой кооперации и общих компонентов", "Потому что все машины имели одинаковый кузов", "Из-за обязательного перехода на дизели", "Потому что цеха работали независимо"], "correct": 0, "explanation": "Машины зависят от поставок деталей, энергии и работы взаимосвязанных цехов."}]}, {"id": "miass", "name": "Миасс", "number": "05", "lat": 55.05, "lon": 60.11, "year": "1941–1944", "title": "Как Урал начал выпускать ЗИС-5В", "machine": "ЗИС-5В", "photo": {"src": "photo-1.jpg", "cap": "Грузовик ЗИС-5 с советскими военнослужащими, Никополь, 1944 год. Завод-изготовитель не установлен", "credit": "Георгий Зельма / советская фотохроника"}, "other": {"src": "zis-column.jpg", "cap": "Колонна ЗИС-5 с военнослужащими. Архивный снимок военных лет", "credit": "Архивная фотография, публикация журнала «За рулём»"}, "factory": {"name": "Миасский автомоторный завод; ныне Автомобильный завод «Урал»", "address": "Миасс, проспект Автозаводцев, 1 — юридический адрес; фактический адрес предприятия также указан как Динамовское шоссе, 2а", "today": "Автомобильный завод «Урал» работает и выпускает современные грузовые автомобили.", "founded": "1941 — решение о размещении автомоторного производства; 1944 — первый ЗИС-5В"}, "person": {"name": "Иван Алексеевич Лихачёв и специалисты ЗИС", "role": "Инженерная преемственность от московского завода к новым площадкам", "text": "Оборудование, навыки и техническая документация московского предприятия стали основой нового производства. Историю завода следует рассматривать как работу многих специалистов, а не только одного директора."}, "facts": [["30.11.1941", "решение о моторном производстве"], ["14.02.1943", "перевод выпуска грузовиков"], ["08.07.1944", "первый миасский ЗИС-5В"], ["3 т", "грузоподъёмность грузовика"]], "sections": [["От моторного завода до автомобильного", "30 ноября 1941 года Государственный комитет обороны принял решение об организации в Миассе автомоторного и литейного производства на базе перемещённых мощностей Московского ЗИС. Первый цех заработал в марте 1942 года. На новом предприятии начинали с изготовления отдельных агрегатов: двигателей, деталей трансмиссии и литья. Для выпуска готового грузовика были необходимы сборочные линии, рамы, кузова и согласованная работа цехов."], ["Почему производство перенесли ещё раз", "14 февраля 1943 года было принято решение перенести из Ульяновска в Миасс выпуск готовых грузовых машин. Переезд и организация производства не завершались одним эшелоном. Приходилось запускать станки, размещать рабочих, налаживать поставки металла, шин и материалов. Первые автомобили были выпущены спустя больше года после решения о переводе производства. Это показывает реальную сложность военного промышленного строительства."], ["ЗИС-5В: знакомство с машиной", "ЗИС-5В — упрощённая военная модификация грузовика ЗИС-5. «Пятёрка» обозначала модель, а буква «В» — вариант военного времени. Грузоподъёмность оставалась около трёх тонн. Бензиновый шестицилиндровый двигатель семейства ЗИС-5, задняя ведущая ось и четырёхступенчатая механическая КПП были понятны водителям и автомеханикам, знакомым с этой техникой. Машина могла служить грузовиком общего назначения, транспортировать людей и снабжение."], ["Что упростили в конструкции", "В условиях дефицита металла и необходимости ускорять выпуск ЗИС-5В получил более простую кабину, часто деревянную, и крылья, не требовавшие сложной штамповки. Изменения конструкции сокращали трудоёмкость. Но упрощённая машина всё равно нуждалась в ежедневном осмотре, заправке, проверке охлаждения и смазки. Механик должен был понимать компромисс между простотой производства и удобством эксплуатации."], ["Первая машина и расширение выпуска", "8 июля 1944 года с конвейера Миасского завода сошёл первый ЗИС-5В. Уже 20 июля партия автомобилей отправилась на фронт; 30 сентября предприятие выпустило тысячный грузовик. К концу 1944 года число собранных машин достигло примерно трёх тысяч. Такой рост не был автоматическим: он отражал работу сборочных линий, поставщиков деталей, испытателей и ремонтных служб."], ["Завод, который работает и сегодня", "На месте исторического автомобильного производства развился завод «Урал». Сегодня предприятие продолжает выпуск грузовых машин. Его юридический адрес — Миасс, проспект Автозаводцев, 1; в официальных материалах указывается и производственная площадка на Динамовском шоссе, 2а. Таким образом, в отличие от бывшей московской территории ЗИЛ, здесь прослеживается непрерывная промышленная история автомобилестроения."]], "specs": [["6 цилиндров", "бензиновый двигатель"], ["4 передачи", "механическая КПП"], ["4×2", "задний привод"], ["3 т", "грузоподъёмность"]], "route": ["moscow", "ulyanovsk", "miass"], "quiz": [{"type": "short", "question": "Введите год выпуска первого ЗИС-5В на Миасском заводе (четыре цифры).", "options": null, "correct": "1944", "explanation": "Первый миасский ЗИС-5В собрали 8 июля 1944 года."}, {"type": "choice", "question": "Какой порядок действий государства и завода правильно отражает переход от автодеталей к выпуску грузовиков?", "options": ["Решение о выпуске готовых автомобилей в 1941-м → моторные цеха в 1943-м → первый ЗИС-5В в 1944-м", "Моторное производство решено разместить в 1941-м → цех заработал в 1942-м → перевод выпуска грузовиков в 1943-м → первый ЗИС-5В в 1944-м", "Первый ЗИС-5В в 1942-м → решение перевести выпуск из Ульяновска в 1943-м → моторный завод открыли в 1944-м", "Решение о переводе выпуска грузовиков в 1941-м → первый ЗИС-5В в 1943-м → тысячный автомобиль в 1945-м"], "correct": 1, "explanation": "В Миассе сначала наладили агрегатное производство, затем сборку готовой машины."}, {"type": "multi", "question": "Какие изменения отличали военный ЗИС-5В от довоенного грузовика?", "options": ["Деревянная кабина", "Упрощённые передние крылья", "Упрощение кузова", "Установка дизеля В-2-34"], "correct": [0, 1, 2], "explanation": "Упрощения снижали расход материалов и трудоёмкость."}, {"type": "order", "question": "Распол : карбюраторный двигатель объёмом 5,55 л", "Оба имели спаренные моторы ГАЗ-202; на танке различалась система охлаждения"], "correct": 0, "explanation": "Впрыск и воспламенение топлива у дизеля и карбюраторного двигателя принципиально различаются."}, {"type": "choice", "question": "Какой фактор объясняет необходимость эвакуировать вместе со станками рабочих и технические документы?", "options": ["Нужны знания, оснастка и организация операций", "Это ускоряло смену названия завода", "Цеха продолжали работать без сотрудников", "Документы заменяли электроэнергию"], "correct": 0, "explanation": "Оборудование без специалистов и технологий не обеспечивает выпуск."}, {"type": "match", "question": "Сопоставьте конструкторов/руководителей и направления.", "options": [["Иван Лихачёв", "Жозеф Котин", "Андрей Липгарт"], ["Конструкторская школа тяжёлых танков", "Автомобильный завод ЗИС", "Главный конструктор ГАЗа"]], "correct": [1, 0, 2], "explanation": "Имена связаны с разными частями истории техники."}, {"type": "choice", "question": "Какая машина использовала два бензиновых двигателя ГАЗ-202?", "options": ["БА-64", "Т-70", "ЗИС-5В", "Т-34"], "correct": 1, "explanation": "Т-70 применял спаренную установку ГАЗ-203."}, {"type": "choice", "question": "Какая пара городов непосредственно связана решениями об эвакуации автомобильного ЗИС?", "options": ["Челябинск — Нижний Тагил", "Горький — Челябинск", "Москва — Миасс", "Нижний Тагил — Горький"], "correct": 2, "explanation": "Часть мощностей ЗИС была основой миасского производства."}], "sources": ["Приказ Наркомата танковой промышленности СССР № 4 от 13.09.1941 (РГАЭ. Ф. 8752. Оп. 4. Д. 2. Л. 7–10).", "История автомобильного завода «Урал»: решения ГКО 1941 и 1943 годов; выпуск ЗИС-5В в 1944 году.", "Музей истории Горьковского автозавода: оборонная продукция, авианалёты и восстановление 1943 года.", "Государственный исторический музей Южного Урала: материалы о Танкограде.", "История Уралвагонзавода и музей Т-34: завод № 183, технология const D=JSON.parse(document.getElementById('dataset').textContent);const root=document.getElementById('app');const byId=id=>D.cities.find(c=>c.id===id);const escapeHTML=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let S;try{S=JSON.parse(localStorage.getItem('victory-geo-v1'))||{}}catch{S={}};if(!S||S.v!==1)S={v:1,city:{},final:{solved:{},tries:{},first:{}},view:'all'};S.city=S.city&&typeof S.city==='object'?S.city:{};S.final=S.final&&typeof S.final==='object'?S.final:{solved:{},tries:{},first:{}};const save=()=>{try{localStorage.setItem('victory-geo-v1',JSON.stringify(S))}catch{}};let view=S.view||'all',route='home',qDraft={choice:-1,multi:[],order:[],match:{}},qFeedback=null;let sovietHistory=null;const PG=id=>{if(id==='final')return S.final;return S.city[id]??(S.city[id]={solved:{},tries:{},first:{},read:false})};const QS=id=>id==='final'?D.final:byId(id).quiz;const complete=id=>QS(id).every((_,i)=>PG(id).solved[i]);const finished=()=>D.cities.filter(c=>complete(c.id)).length;
const go=x=>{route=x;qDraft={choice:-1,multi:[],order:[],match:{}};qFeedback=null;draw();window.scrollTo(0,0)};
function nav(){return `<header><button class="brand" data-go="home"><b>ИП</b><span>ИНЖЕНЕРЫ<br/>ПОБЕДЫ<small>ИСТОРИЧЕСКИЙ АТЛАС · 1941—1945</small></span></button><nav><button data-go="map">Карта</button><button data-go="archive">Архив</button><button data-go="teacher">Преподавателю</button><button data-go="sources">Источники</button></nav><span style="font-size:12px;color:#b7a686">${finished()} / 5</span></header>`}function footer(){return `<footer>«ИНЖЕНЕРЫ ПОБЕДЫ» · УЧЕБНЫЙ ПРОЕКТ ПО ИСТОРИИ АВТОМОБИЛЕСТРОЕНИЯ СССР</footer>`}function layout(x){return nav()+x+footer()}
function hero(){return layout(`<section class="hero"><div class="hero-copy"><div class="eyebrow" style="color:#bb9b74">ВОЕННАЯ ПРОМЫШЛЕННОСТЬ · 1941—1945</div><h1>Инженеры<br/><em>Победы</em></h1><p>История пяти городов СССР через автомобили, танки, заводы и работу людей. Откройте производственную географию войны, изучите устройство машин и выполните контрольные задания.</p><button class="primary" data-go="map">Начать экспедицию →</button><div style="margin-top:38px;letter-spacing:.11em;font-size:11px;color:#c6ba9f">5 ИСТОРИЧЕСКИХ ГЛАВ · АВТОМЕХАНИКА · ПРОВЕРКА ЗНАНИЙ</div></div><div class="hero-art" role="img" aria-label="Архивная фотография сборки Т-34 в годы войны"></div></section><div class="wrap intro-strip"><strong>Пять городов — одна система</strong><span>Техника, инженеры, производственные решения и снабжение фронта</span></div>`)}
const MAP_GEO={"all": {"z": 5, "x0": 4639, "y0": 2292}, "europe": {"z": 5, "x0": 4439, "y0": 2284}, "ural": {"z": 6, "x0": 10365, "y0": 4786}};
function positions(kind,c){const m=MAP_GEO[kind],n=256*2**m.z;return {x:(c.lon+180)/360*n-m.x0,y:(1-Math.asinh(Math.tan(c.lat*Math.PI/180))/Math.PI)/2*n-m.y0}};
const offsets={all:{moscow:[-135,-20],gorky:[22,-20],tagil:[-140,-27],chelyabinsk:[38,42],miass:[-135,42]},europe:{moscow:[-138,-22],gorky:[18,-19]},ural:{tagil:[-140,-20],chelyabinsk:[28,33],miass:[-135,41]}};
function historicalOutline(kind){if(!sovietHistory)return '';const bbox=D.geo[kind].bbox,[x0,x1,y0,y1]=bbox;const G=sovietHistory.geometry;if(!G||!G.coordinates)return '';const polys=G.type==='MultiPolygon'?G.coordinates:G.type==='Polygon'?[G.coordinates]:[];let contours=[];
for(const polygon of polys){for(const ring of polygon){let d='';let n=0;for(const point of ring){let lon=point[0]<0?point[0]+360:point[0],lat=point[1];let x=(lon-x0)/(x1-x0)*1180,y=(y1-lat)/(y1-y0)*550;if(!Number.isFinite(x+y))continue;if(n++%2!==0&&n<ring.length-1)continue;d+=(d?'L':'M')+x.toFixed(1)+','+y.toFixed(1)}if(d)contours.push(d+'Z')}}return contours.map(d=>'<path d="'+d+'" fill="#cad6cc" fill-rule="evenodd" stroke="#8b453a" stroke-width="2"/>').join('')}
function mapSVG(kind='all',mode='map',cityIDs=null){
 const layer=D.geo[kind],b=layer.bbox,chosen=cityIDs||D.cities.filter(c=>kind==='all'||(kind==='ural'?['tagil','chelyabinsk','miass'].includes(c.id):['moscow','gorky'].includes(c.id))).map(c=>c.id);
 const fill=`<image class="geographic-base" href="geography-${kind}.jpg" x="0" y="0" width="1180" height="550" preserveAspectRatio="none"/>`;
 const meridians=[],parallels=[];

 for(let lat=Math.ceil(b[2]/2)*2;lat<b[3];lat+=2){const y=(b[3]-lat)/(b[3]-b[2])*550;parallels.push(`<line class="gridline" x1="0" y1="${y}" x2="1180" y2="${y}"/><text x="5" y="${y-5}" font-size="13" fill="#5f7770">${lat}° с. ш.</text>`)}
 let routeGeometry='';
 if(mode==='route'){

  routeGeometry='<defs><marker id="arrowhead" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#ad513e"/></marker></defs>';
  for(let i=0;i<2;i++){const a=anchors[i],z=anchors[i+1],cx=(a.x+z.x)/2,cy=(a.y+z.y)/2-56;routeGeometry+=`<path d="M${a.x},${a.y} Q${cx},${cy} ${z.x},${z.y}" fill="none" stroke="#ad513e" stroke-width="5" stroke-dasharray="11 8" marker-end="url(#arrowhead)"/>`}
  const ul=anchors[1];routeGeometry+=`<circle cx="${ul.x}" cy="${ul.y}" r="7" fill="#ad513e" stroke="white" stroke-width="3"/><text class="route-label" x="${ul.x+16}" y="${ul.y-18}">УЛЬЯНОВСК</text>`;
 }
 const labels=chosen.map(id=>{const c=byId(id),p=positions(kind,c),off=(offsets[kind]||offsets.all)[id]||[18,-15],xp=p.x+off[0],yp=p.y+off[1],dir=off[0]<0?-1:1;return `<g class="city-marker" tabindex="0" role="button" aria-label="Открыть город ${escapeHTML(c.name)}" data-city="${id}"><line class="leader" x1="${p.x}" y1="${p.y}" x2="${xp+8*dir}" y2="${yp+7}"/><circle class="hit" cx="${p.x}" cy="${p.y}" r="23"/><circle cx="${p.x}" cy="${p.y}" r="8"/><text class="txt" x="${xp}" y="${yp}">${escapeHTML(c.name.toUpperCase())}</text></g>`}).join('');
 return `<svg class="map-svg" viewBox="0 0 1180 550" role="group" aria-label="Географическая карта промышленных центров"><rect width="1180" height="550" fill="#dce6e3"/>${fill}${routeGeometry}${labels}<rect x="0" y="520" width="1180" height="30" fill="#f4f0e7" fill-opacity=".94"/><text x="16" y="540" fill="#374d50" font-size="12">${mode==='route'?'НАПРАВЛЕНИЕ ЭВАКУАЦИИ · НЕ ТОЧНЫЙ МАРШРУТ':'СОВРЕМЕННАЯ ГЕОГРАФИЧЕСКАЯ ОСНОВА'}</text><text x="1164" y="540" text-anchor="end" fill="#374d50" font-size="12">© Участники OpenStreetMap · ODbL</text></svg>`;
}
function atlas(){const cities=D.cities.filter(c=>view==='all'||(view==='ural'?['tagil','chelyabinsk','miass'].includes(c.id):['moscow','gorky'].includes(c.id)));return layout(`<main class="wrap"><div class="heading"><div><span class="eyebrow">ИСТОРИЧЕСКИЙ АТЛАС · ПРОМЫШЛЕННОСТЬ ВОЙНЫ</span><h1>Города и заводы<br/><em style="color:var(--terr)">военного тыла</em></h1></div><p>Выберите город. Узнайте, какая техника здесь производилась, кто руководил работами и где находились предприятия.</p></div><div class="tabs"><button data-view="all" class="${view==='all'?'active':''}">Все пять городов</button><button data-view="europe" class="${view==='europe'?'active':''}">Москва и Горький</button><button data-view="ural" class="${view==='ural'?'active':''}">Уральские города</button></div><div class="map-layout"><div><div class="atlas"><div class="atlas-top"><b>${view==='ural'?'УРАЛ / ТРИ ПРОМЫШЛЕННЫХ ЦЕНТРА':view==='europe'?'МОСКВА И ГОРЬКИЙ / ДВА АВТОЗАВОДА':'ВОСТОЧНАЯ ЕВРОПА И УРАЛ / ПЯТЬ ГОРОДОВ'}</b><span>Реальная карта · точки городов</span></div><div class="map-canvas">${mapSVG(view)}</div><div class="legend">Маркер обозначает центр города, не ворота завода. Для заводов указаны отдельные адреса в главах.<span>● Изучаемый город</span></div></div><div class="small-note" style="padding:12px 0">${sovietHistory?'<button class="outline" data-export-map="1" style="margin-bottom:10px">Сохранить историческую карту в SVG ↓</button><div></div>':''}${sovietHistory?'Границы на 22 июня 1941 года — датированный векторный слой CShapes 2.0 (Schvitz и др., 2022, CC BY-NC-SA 4.0).':'Географическая основа OpenStreetMap — современная: города, реки, дороги и названия. Точки обозначают пять исторических промышленных центров; Горький — современный Нижний Новгород. Границы на подложке не являются границами СССР 1941 года.'}</div></div><aside class="city-rail"><div class="rail-head"><span class="eyebrow">ПЯТЬ ИСТОРИЧЕСКИХ ГЛАВ</span><strong>${finished()} / 5</strong></div>${cities.map(c=>`<button class="rail-item" data-go="city/${c.id}"><span class="num">${c.number}</span><span><b>${escapeHTML(c.name)}</b><small>${escapeHTML(c.title)}</small><small>${complete(c.id)?'✓ Глава завершена':'Открыть главу →'}</small></span><span>→</span></button>`).join('')}</aside></div><div class="route-panel"><span class="eyebrow">ИСТОРИЧЕСКАЯ СВЯЗЬ</span><h3>Московский ЗИС → Миасс</h3><p>Эвакуация автомобильного производства началась в октябре 1941 года. В ноябре 1941 года было принято решение о размещении автомоторного и литейного производства в Миассе. Это схема направлений перемещения, а не точный железнодорожный маршрут каждого эшелона.</p><button class="outline" data-go="route">Посмотреть историю перемещения →</button></div><div class="route-panel"><h3>Итоговая контрольная</h3><p>${finished()===5?'Все главы завершены, можно начинать итоговую работу.':'Откроется после прохождения всех пяти глав и контрольных заданий.'}</p><button class="primary" data-go="quiz/final/0" ${finished()!==5?'disabled':''}>Итоговая работа →</button></div></main>`)}
function photo(p){return `<figure class="photo"><img loading="lazy" src="${escapeHTML(p.src)}" alt="${escapeHTML(p.cap)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"/><div class="photo-broken" style="display:none">Архивная фотография недоступна в этой сети</div><figcaption>${escapeHTML(p.cap)}<br/><b>${escapeHTML(p.credit)}</b></figcaption></figure>`}
function machine(c){return `<div class="mechanics"><span class="eyebrow" style="color:var(--gold)">ТЕХНИЧЕСКИЙ АТЛАС</span><h3>Как устроена ${escapeHTML(c.machine)}</h3><div class="mechanic-tabs">${c.specs.map((item,i)=>`<button data-mechanic="${i}" class="${i===0?'active':''}">${escapeHTML(item[1])}</button>`).join('')}</div><div class="mechanic-detail"><b>${escapeHTML(c.specs[0][0])}</b><p>Характеристики машины связаны с историей её изготовления, эксплуатации и ремонта.</p></div></div>`}
const FACTORY_COORDS={tagil:[57.92454,60.095474],chelyabinsk:[55.158549,61.468086],gorky:[56.249047,43.883786],miass:[55.0712,60.1006]};
function factoryMap(c){let point=FACTORY_COORDS[c.id];if(!point)return '<p class="small-note">Московская историческая площадка: Автозаводская улица, 23. Точка проходной будет нанесена после сверки с историческим планом.</p>';
const z=12,n=2**z,lat=point[0],lon=point[1],xt=(lon+180)/360*n,yt=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;let xi=Math.floor(xt),yi=Math.floor(yt),tile='';for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)tile+='<img src="'+z+'-'+(xi+dx)+'-'+(yi+dy)+'.png" alt="" loading="lazy"/>';
return '<div class="factory-map"><div class="factory-tiles" style="margin-left:'+(-256-(xt-xi)*256)+'px;margin-top:'+(-256-(yt-yi)*256)+'px">'+tile+'</div><span class="factory-point" aria-label="Местоположение заводской площадки"></span><span class="factory-map-attribution">© Участники OpenStreetMap · современная карта</span></div>'}
function chapters(c){return c.sections.map((s,i)=>`<section id="sec${i}"><span class="eyebrow">РАЗДЕЛ ${String(i+1).padStart(2,'0')} / ${String(c.sections.length).padStart(2,'0')}</span><h2>${escapeHTML(s[0])}</h2><p>${escapeHTML(s[1])}</p>${i===0?photo(c.photo):''}${i===1?`<div class="specs">${c.specs.map(v=>`<div><strong>${escapeHTML(v[0])}</strong><small>${escapeHTML(v[1])}</small></div>`).join('')}</div>`:''}${i===2?machine(c):''}${i===3?photo(c.other):''}${i===4?`<div class="factory"><span class="eyebrow">ЗАВОД · ТОГДА И СЕЙЧАС</span><h3>${escapeHTML(c.factory.name)}</h3><p><b>Адрес:</b> ${escapeHTML(c.factory.address)}</p><p><b>Сегодня:</b> ${escapeHTML(c.factory.today)}</p>${factoryMap(c)}</div>`:''}${i===5?`<div class="portrait"><b>ЛЮДИ И РЕШЕНИЯ</b><h3>${escapeHTML(c.person.name)}</h3><p><b>${escapeHTML(c.person.role)}</b></p><p>${escapeHTML(c.person.text)}</p></div>`:''}</section>`).join('')}
function chapter(id){const c=byId(id);if(!c)return atlas();return layout(`<div class="chapter-banner"><div class="copy"><span class="eyebrow" style="color:var(--gold)">${escapeHTML(c.name.toUpperCase())} · ${escapeHTML(c.year)} · ГЛАВА ${c.number}</span><h1>${escapeHTML(c.title)}</h1><p>Техника, устройство, производство и люди в истории Великой Отечественной войны.</p><button class="ghost" data-go="map">← К карте</button></div><figure><img src="${escapeHTML(c.photo.src)}" alt="${escapeHTML(c.photo.cap)}" onerror="this.style.display='none'"/><figcaption>${escapeHTML(c.photo.cap)}</figcaption></figure></div><div class="wrap read-layout"><main class="article">${chapters(c)}<div class="done" style="padding:45px 15px"><h2>Проверить знания</h2><p>В контрольной нужно знать факты, устройство машин, даты и результаты инженерных решений.</p><button class="primary" data-startquiz="${id}">Контрольная работа →</button></div></main><aside class="toc"><div class="eyebrow">СОДЕРЖАНИЕ</div>${c.sections.map((sec,i)=>`<button data-scroll="sec${i}">${String(i+1).padStart(2,'0')} · ${escapeHTML(sec[0])}</button>`).join('')}</aside></div>`)}
function routePage(){return layout(`<main class="wrap"><div class="heading"><div><span class="eyebrow">ЭВАКУАЦИЯ ЗИС · 1941–1944</span><h1>Станки и рабочие<br/><em style="color:var(--terr)">на восток</em></h1></div><p>Историческая схема направлений эвакуации, без претензии на точный путь военных эшелонов.</p></div><div class="atlas"><div class="map-canvas">${mapSVG('all','route',['moscow','miass'])}</div></div><div class="route-panel"><h3>16 октября 1941 → 30 ноября 1941 → 8 июля 1944</h3><p>Решение об эвакуации Московского ЗИС → организация автомоторного и литейного производства в Миассе → выход первого ЗИС-5В с конвейера Миасского завода.</p></div><button class="primary" data-go="city/moscow">Читать о московском ЗИС →</button></main>`)}
function optionMarkup(q){const arr=q.options;if(q.type==='choice'||q.type==='multi')return `<div class="answers">${arr.map((x,i)=>`<button class="answer ${qDraft.choice===i||qDraft.multi.includes(i)?'sel':''}" data-answer="${i}"><i>${q.type==='multi'?(qDraft.multi.includes(i)?'☑':'□'):String(i+1).padStart(2,'0')}</i>${escapeHTML(x)}</button>`).join('')}</div>`;if(q.type==='order')return `<div class="sequence">${qDraft.order.map((id,i)=>`<button data-unorder="${i}">${i+1}. ${escapeHTML(arr[id])} ×</button>`).join('')}</div><p class="small-note">Выберите карточки в нужном порядке:</p><div class="answers">${arr.map((x,i)=>qDraft.order.includes(i)?'':`<button class="answer" data-order="${i}">+ ${escapeHTML(x)}</button>`).join('')}</div>`;if(q.type==='match'){return `<div class="pairs">${q.options.map((x,i)=>`<label><b>${escapeHTML(x)}</b><select data-match="${i}"><option value="">Выберите соответствие</option>${q.correctTexts.map((v,k)=>`<option value="${k}" ${qDraft.match[i]===k?'selected':''}>${escapeHTML(v)}</option>`).join('')}</select></label>`).join('')}</div>`}return ''}
function quizPage(id,ix){if(id==='final'&&finished()!==5)return atlas();const c=id==='final'?null:byId(id);const qs=QS(id),pg=PG(id);if(c&&!pg.read)return chapter(id);const index=+ix||0,q=qs[index];if(!q)return done(id);if(q.type==='match'){// dataset tuple format options contains left list and correct contains mapping; need normalized right side in explanation? D.QUIZ match tuple passes options=[left,right], correct=[indices]
}
let options='';const mode=q.type; if(mode==='choice'||mode==='multi')options=optionMarkup(q); else if(mode==='order')options=optionMarkup(q); else if(mode==='match'){let left=q.options[0],right=q.options[1];options=`<div class="pairs">${left.map((x,i)=>`<label><b>${escapeHTML(x)}</b><select data-match="${i}"><option value="">Выберите соответствие</option>${right.map((y,j)=>`<option value="${j}" ${qDraft.match[i]===j?'selected':''}>${escapeHTML(y)}</option>`).join('')}</select></label>`).join('')}</div>`}
if(mode==='short')options='<label class="short-question">Напишите ответ без подсказок<input type="text" data-short inputmode="numeric" placeholder="Введите год" maxlength="4"></label>';
return layout(`<main class="wrap exam-layout"><div class="exam-box"><span class="eyebrow">${id==='final'?'ИТОГОВАЯ ПРОВЕРКА':escapeHTML(c.name.toUpperCase())+' · КОНТРОЛЬНАЯ'} · ${index+1}/${qs.length}</span><div class="progressbar">${qs.map((_,j)=>`<span class="${pg.solved[j]?'on':''}"></span>`).join('')}</div><h2>${escapeHTML(q.question)}</h2>${options}${qFeedback?`<div class="feedback"><b>${qFeedback.ok?'Верно':'Проверьте ещё раз'}</b><p>${escapeHTML(qFeedback.msg)}</p></div>`:''}<div class="spaced" style="margin-top:25px">${pg.solved[index]?`<button class="primary" data-go="${index===qs.length-1?'done/'+id:'quiz/'+id+'/'+(index+1)}">${index===qs.length-1?'Завершить работу':'Следующий вопрос'} →</button>`:`<button class="primary" data-submit="${index}">Проверить ответ →</button>`}<button class="outline" data-go="${id==='final'?'map':'city/'+id}">${id==='final'?'← К карте':'← Вернуться к главе'}</button></div></div><aside class="exam-side"><span class="eyebrow">ПРОВЕРКА ЗНАНИЙ</span><h3>Работа с фактами</h3><p style="line-height:1.8;color:var(--muted);font-size:13px">Правильные ответы сохраняются. После ошибки можно изучить материал ещё раз и вернуться к вопросу.</p><p><strong>${Object.keys(pg.solved).length} / ${qs.length}</strong> выполнено</p></aside></main>`)}
function done(id){if(!complete(id))return quizPage(id,QS(id).findIndex((_,i)=>!PG(id).solved[i]));const c=id==='final'?null:byId(id);return layout(`<main class="wrap done"><div class="eyebrow">${c?'ГЛАВА ИЗУЧЕНА':'ИТОГОВАЯ РАБОТА'}</div><h1>${c?escapeHTML(c.name):'Экспедиция завершена'}</h1><p>${c?'Контрольная пройдена — объект добавлен в архив.':'Изучены пять городов и история военного автомобилестроения.'}</p><button class="primary" data-go="${c?'map':'archive'}">${c?'Вернуться к карте':'Открыть архив'} →</button></main>`)}
function archive(){return layout(`<main class="wrap"><div class="heading"><div><span class="eyebrow">ИСТОРИЧЕСКИЕ ЭКСПОНАТЫ</span><h1>Архив<br/><em style="color:var(--terr)">Победы</em></h1></div><p>Материалы открываются после правильного выполнения контрольных работ по каждому городу.</p></div><div class="map-layout" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${D.cities.map(c=>`<article class="factory"><div class="eyebrow">${escapeHTML(c.name)}</div><h3>${escapeHTML(c.machine)}</h3>${complete(c.id)?photo(c.photo):'<p>Материал откроется после изучения главы.</p>'}<button class="outline" data-go="city/${c.id}">Читать историю →</button></article>`).join('')}</div></main>`)}
function teacher(){return layout(`<main class="wrap"><div class="heading"><div><span class="eyebrow">ДЛЯ ПРЕПОДАВАТЕЛЯ</span><h1>Рекомендации<br/><em style="color:var(--terr)">к занятию</em></h1></div><p>Ресурс рассчитан на самостоятельное чтение или групповую работу с обсуждением.</p></div><div class="route-panel"><h3>Групповой сценарий</h3><p>Каждая команда изучает один город, находит по главе ключевые даты, характеристики машин и важные инженерные решения, проходит контрольную и представляет результат группе.</p></div><div class="route-panel"><h3>Самостоятельный сценарий</h3><p>Студент проходит последовательно главы, контролирует усвоение материала и затем отвечает на итоговую контрольную.</p></div></main>`)}
function sources(){return layout(`<main class="wrap"><div class="heading"><div><span class="eyebrow">БИБЛИОГРАФИЯ</span><h1>Источники<br/><em style="color:var(--terr)">и документы</em></h1></div></div><div class="sources">${D.sources.map(x=>`<div>${escapeHTML(x)}</div>`).join('')}<div><b>Картографическая основа:</b> Города нанесены по реальным координатам в проекции Web Mercator поверх современной карты OpenStreetMap (© Участники OpenStreetMap, ODbL). Подложка содержит современные названия и границы и не обозначает территорию СССР 1941 года. Исторический контур СССР не прошёл независимую проверку и не показывается. Схема эвакуации обозначает направления, а не точные пути эшелонов. Карты заводских площадок OpenStreetMap являются современными и подписаны отдельно.</div></div></main>`)}
function draw(){const [a,b,c]=route.split('/');root.innerHTML=a==='home'?hero():a==='map'?atlas():a==='city'?chapter(b):a==='quiz'?quizPage(b,c):a==='done'?done(b):a==='route'?routePage():a==='archive'?archive():a==='teacher'?teacher():a==='sources'?sources():hero()}
function submit(i){const [,id]=route.split('/');const q=QS(id)[i],pg=PG(id);if(pg.solved[i])return;let correct=false;if(q.type==='choice')correct=qDraft.choice===q.correct;else if(q.type==='multi')correct=JSON.stringify([...qDraft.multi].sort())===JSON.stringify([...q.correct].sort());else if(q.type==='order')correct=JSON.stringify(qDraft.order)===JSON.stringify(q.correct);else if(q.type==='match')correct=q.correct.every((x,j)=>qDraft.match[j]===x);else if(q.type==='short')correct=(root.querySelector('[data-short]')?.value||'').trim()===String(q.correct);pg.tries[i]=(pg.tries[i]||0)+1;if(correct){pg.solved[i]=1;pg.first[i]=pg.tries[i]===1;}qFeedback={ok:correct,msg:q.explanation};save();draw()}

root.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-view],[data-city],[data-startquiz],[data-scroll],[data-answer],[data-order],[data-unorder],[data-submit],[data-mechanic],[data-export-map]');if(!b)return;if(b.dataset.exportMap){if(sovietHistory){const svg=root.querySelector('.map-svg');if(svg){const text='<?xml version="1.0" encoding="UTF-8"?>'+new XMLSerializer().serializeToString(svg);const url=URL.createObjectURL(new Blob([text],{type:'image/svg+xml;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Инженеры_Победы_СССР_22-06-1941.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}}return;}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.view){view=b.dataset.view;S.view=view;save();draw();return}if(b.dataset.city){go('city/'+b.dataset.city);return}if(b.dataset.startquiz){PG(b.dataset.startquiz).read=true;save();go('quiz/'+b.dataset.startquiz+'/0');return}if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth'});return}if(b.dataset.answer!==undefined){const type=QS(route.split('/')[1])[+route.split('/')[2]].type;const i=+b.dataset.answer;if(type==='multi'){qDraft.multi=qDraft.multi.includes(i)?qDraft.multi.filter(x=>x!==i):[...qDraft.multi,i]}else{qDraft.choice=i}qFeedback=null;draw();return}if(b.dataset.order!==undefined){qDraft.order.push(+b.dataset.order);qFeedback=null;draw();return}if(b.dataset.unorder!==undefined){qDraft.order.splice(+b.dataset.unorder,1);qFeedback=null;draw();return}if(b.dataset.submit!==undefined){submit(+b.dataset.submit);return}if(b.dataset.mechanic!==undefined){const box=b.closest('.mechanics'),c=byId(route.split('/')[1]),n=+b.dataset.mechanic;box.querySelectorAll('[data-mechanic]').forEach(el=>el.classList.toggle('active',+el.dataset.mechanic===n));box.querySelector('.mechanic-detail').innerHTML=`<b>${escapeHTML(c.specs[n][0])}</b><p>${escapeHTML(c.specs[n][1])} — важная характеристика машины для её эксплуатации и обслуживания.</p>`;return}});
root.addEventListener('change',e=>{if(e.target.matches('[data-match]')){qDraft.match[+e.target.dataset.match]=+e.target.value;qFeedback=null}});root.addEventListener('keydown',e=>{const t=e.target.closest('[data-city]');if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go('city/'+t.dataset.city)}});draw();fetchHistorical();
